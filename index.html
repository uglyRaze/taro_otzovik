<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отзывы</title>
<style>
  :root{
    --bg: #0f1115;
    --bg-soft: #171a21;
    --card: #1c2028;
    --card-hover: #22262f;
    --accent: #6c5ce7;
    --accent-2: #a29bfe;
    --text: #f1f2f6;
    --text-dim: #9aa0ac;
    --border: #2a2f3a;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at top, #1a1d25 0%, var(--bg) 60%);
    color: var(--text);
    min-height:100vh;
  }

  header{
    text-align:center;
    padding: 60px 20px 40px;
  }

  header h1{
    font-size: clamp(28px, 5vw, 44px);
    margin:0 0 12px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p{
    color: var(--text-dim);
    max-width: 560px;
    margin: 0 auto;
    font-size: 15px;
  }

  .container{
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  /* Форма добавления отзыва */
  .add-review{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 40px;
  }

  .add-review h2{
    margin-top:0;
    font-size: 18px;
  }

  .add-review .author-note{
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 16px;
  }

  textarea{
    width:100%;
    min-height: 90px;
    resize: vertical;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    outline:none;
    transition: border-color .2s;
  }

  textarea:focus{ border-color: var(--accent); }

  .add-review .row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 14px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .rating-picker{
    display:flex;
    gap:4px;
    font-size: 22px;
    cursor:pointer;
    user-select:none;
  }

  .rating-picker span{ opacity:.35; transition:opacity .15s; }
  .rating-picker span.active{ opacity:1; }

  button{
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color:#fff;
    border:none;
    border-radius: 10px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight:600;
    cursor:pointer;
    transition: transform .15s, opacity .15s;
  }

  button:hover{ transform: translateY(-1px); opacity:.92; }
  button:active{ transform: translateY(0); }

  .status-msg{
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 8px;
    min-height: 16px;
  }

  /* Сетка отзывов */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .review-card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    transition: background .2s, transform .2s;
    animation: fadeIn .4s ease both;
  }

  .review-card:hover{
    background: var(--card-hover);
    transform: translateY(-2px);
  }

  .review-top{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .avatar{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size: 15px;
    flex-shrink:0;
  }

  .name-block{ display:flex; flex-direction:column; }

  .name{ font-weight:600; font-size:14px; }
  .stars{ color:#ffd166; font-size: 13px; letter-spacing:1px; }

  .review-text{
    color: var(--text-dim);
    font-size: 14px;
    line-height:1.5;
    margin:0;
  }

  .badge-anon{
    font-size: 11px;
    color: var(--accent-2);
    border: 1px solid var(--accent-2);
    padding: 1px 7px;
    border-radius: 20px;
    width:fit-content;
  }

  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  footer{
    text-align:center;
    color: var(--text-dim);
    font-size: 12px;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>Отзывы наших клиентов</h1>
  <p>Здесь можно оставить свой отзыв — он будет опубликован анонимно.</p>
</header>

<div class="container">

  <div class="add-review">
    <h2>Оставить отзыв</h2>
    <div class="author-note">Имя автора всегда будет показано как «Аноним»</div>

    <div class="rating-picker" id="ratingPicker">
      <span data-v="1">★</span>
      <span data-v="2">★</span>
      <span data-v="3">★</span>
      <span data-v="4">★</span>
      <span data-v="5">★</span>
    </div>

    <textarea id="reviewInput" placeholder="Напишите ваш отзыв..."></textarea>

    <div class="row">
      <button id="submitBtn">Отправить отзыв</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <div class="grid" id="reviewsGrid"></div>
</div>

<footer>© 2026 · Сайт отзывов</footer>

<script>
/* ==========================================================
   ЗАГЛУШКА ДЛЯ БЭКЕНДА
   ==========================================================
   Сейчас отзывы хранятся только в памяти браузера (массив reviews)
   и пропадают при перезагрузке страницы.

   Когда будет сервер — замени тело функций ниже:

   1) loadReviewsFromServer() — должна делать запрос к твоему API
      и возвращать массив отзывов вида:
      { name: "Аноним", text: "...", rating: 5 }

   2) saveReviewToServer(review) — должна отправлять новый отзыв
      на сервер, например:

      async function saveReviewToServer(review) {
        const res = await fetch("https://ТВОЙ-БЭКЕНД/api/reviews", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(review)
        });
        return res.json();
      }

   Больше никакие другие части кода трогать не нужно —
   вся логика уже вызывает эти две функции.
   ========================================================== */

async function loadReviewsFromServer() {
  // TODO: заменить на реальный fetch() к бэкенду
  return null; // null означает "используем локальные заглушки ниже"
}

async function saveReviewToServer(review) {
  // TODO: заменить на реальный fetch() POST к бэкенду
  console.log("Заглушка: отзыв не отправлен на сервер", review);
  return review;
}

/* ========================================================== */

const texts = [
  "Все круто, спасибо!",
  "Отличный сервис, всё понравилось.",
  "Все супер, рекомендую.",
  "Очень доволен, все ок.",
  "Все отлично, буду обращаться еще.",
  "Хороший сервис, все круто.",
  "Все понравилось, спасибо большое.",
  "Все на высшем уровне.",
  "Все круто, никаких проблем.",
  "Отлично, все понравилось."
];

function randomFrom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function generateStubReviews(count){
  const result = [];
  for(let i = 0; i < count; i++){
    result.push({
      name: "Аноним",
      text: randomFrom(texts),
      rating: 4 + Math.round(Math.random()) // 4 или 5 звезд
    });
  }
  return result;
}

let reviews = [];

function renderReviews(){
  const grid = document.getElementById("reviewsGrid");
  grid.innerHTML = "";
  reviews.forEach(r => {
    const card = document.createElement("div");
    card.className = "review-card";

    const isAnon = r.name === "Аноним";
    const initial = isAnon ? "?" : r.name.charAt(0).toUpperCase();

    card.innerHTML = `
      <div class="review-top">
        <div class="avatar">${initial}</div>
        <div class="name-block">
          <span class="name">${r.name}</span>
          <span class="stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span>
        </div>
      </div>
      ${isAnon ? '<span class="badge-anon">Анонимный отзыв</span>' : ''}
      <p class="review-text">${r.text}</p>
    `;
    grid.appendChild(card);
  });
}

let currentRating = 5;
const ratingPicker = document.getElementById("ratingPicker");
function updateStars(){
  [...ratingPicker.children].forEach(s => {
    s.classList.toggle("active", Number(s.dataset.v) <= currentRating);
  });
}
ratingPicker.addEventListener("click", e => {
  if(e.target.dataset.v){
    currentRating = Number(e.target.dataset.v);
    updateStars();
  }
});
updateStars();

document.getElementById("submitBtn").addEventListener("click", async () => {
  const input = document.getElementById("reviewInput");
  const statusMsg = document.getElementById("statusMsg");
  const text = input.value.trim();

  if(!text){
    statusMsg.textContent = "Напишите текст отзыва перед отправкой.";
    return;
  }

  const newReview = { name: "Аноним", text, rating: currentRating };

  statusMsg.textContent = "Отправка...";
  await saveReviewToServer(newReview); // заглушка / позже настоящий сервер

  reviews.unshift(newReview);
  renderReviews();

  input.value = "";
  currentRating = 5;
  updateStars();
  statusMsg.textContent = "Спасибо! Отзыв опубликован.";
  setTimeout(() => statusMsg.textContent = "", 2500);
});

(async function init(){
  const fromServer = await loadReviewsFromServer();
  reviews = fromServer && fromServer.length ? fromServer : generateStubReviews(50);
  renderReviews();
})();
</script>

</body>
</html>
