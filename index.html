<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>taro_otzovik — Отзывы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #140b23;
    --bg-2: #1c1236;
    --card: #1b1230;
    --card-border: rgba(212,175,106,0.22);
    --card-border-hover: rgba(212,175,106,0.45);
    --gold: #c9a35f;
    --gold-bright: #e8c785;
    --violet: #8b6fd6;
    --text: #f1ecdf;
    --text-dim: #b9aecb;
    --text-faint: #786f92;
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  html, body { margin:0; }

  body{
    font-family: 'Cormorant Garamond', serif;
    background: var(--bg);
    background-image: radial-gradient(ellipse 70% 45% at 50% 0%, rgba(139,111,214,0.22), transparent 65%);
    color: var(--text);
    min-height:100vh;
    position:relative;
  }

  .stars-bg{
    position: fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.55;
    background-image:
      radial-gradient(1.4px 1.4px at 10% 20%, #fff, transparent 60%),
      radial-gradient(1px 1px at 28% 68%, #fff, transparent 60%),
      radial-gradient(1.4px 1.4px at 48% 14%, #fff, transparent 60%),
      radial-gradient(1px 1px at 66% 52%, #fff, transparent 60%),
      radial-gradient(1.4px 1.4px at 83% 24%, #fff, transparent 60%),
      radial-gradient(1px 1px at 93% 78%, #fff, transparent 60%),
      radial-gradient(1.4px 1.4px at 16% 84%, #fff, transparent 60%),
      radial-gradient(1px 1px at 38% 40%, #fff, transparent 60%),
      radial-gradient(1.4px 1.4px at 58% 90%, #fff, transparent 60%),
      radial-gradient(1px 1px at 76% 62%, #fff, transparent 60%);
    background-repeat: repeat;
    background-size: 320px 320px;
  }
  @media (prefers-reduced-motion: no-preference){
    .stars-bg{ animation: twinkle 6s ease-in-out infinite; }
  }
  @keyframes twinkle{ 0%,100%{ opacity:.4; } 50%{ opacity:.65; } }

  header, .container{ position:relative; z-index:1; }

  header{
    text-align:center;
    padding: 56px 20px 32px;
  }

  /* ---------- fanned tarot cards, hero signature ---------- */
  .card-fan{
    display:flex;
    justify-content:center;
    margin-bottom: 18px;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.45));
  }
  .card-fan svg{ width: 168px; height: auto; overflow: visible; }
  @media (prefers-reduced-motion: no-preference){
    .card-fan g.card{ transition: transform .35s ease; transform-origin: 110px 132px; }
    .card-fan:hover g.card1{ transform: rotate(-20deg) translateY(-4px); }
    .card-fan:hover g.card3{ transform: rotate(20deg) translateY(-4px); }
    .card-fan:hover g.card2{ transform: translateY(-8px); }
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:'Cinzel', serif;
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .moon{ position:relative; width:16px; height:16px; flex-shrink:0; }
  .moon::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    background: var(--gold-bright);
  }
  .moon::after{
    content:""; position:absolute; top:-1px; left:5px; width:16px; height:16px;
    border-radius:50%; background: var(--bg);
  }

  header h1{
    font-family:'Cinzel', serif;
    font-size: clamp(30px, 5vw, 46px);
    font-weight:600;
    margin:0 0 16px;
    letter-spacing: .02em;
    color: var(--text);
  }
  header h1 span{
    background: linear-gradient(100deg, var(--gold-bright), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p{
    font-style: italic;
    color: var(--text-dim);
    max-width: 460px;
    margin: 0 auto;
    font-size: 17px;
    line-height:1.6;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    color: var(--gold);
    font-size: 12px;
    margin-top: 22px;
    opacity:.7;
  }
  .divider::before, .divider::after{
    content:"";
    width: 46px;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--card-border-hover), transparent);
  }

  .container{
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 24px 100px;
  }

  .panel{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
  }

  .add-review-wrap{
    display:flex;
    justify-content:center;
    margin: 40px 0 64px;
  }

  .add-review{
    padding: 30px 30px 24px;
    width:100%;
    max-width: 500px;
    position:relative;
  }
  .add-review::before{
    content:"✦";
    position:absolute;
    top:14px; right:18px;
    color: var(--gold);
    font-size: 13px;
    opacity:.6;
  }

  .panel-title{
    margin-bottom: 6px;
  }

  .add-review h2{
    margin: 0;
    font-family:'Cinzel', serif;
    font-size: 16px;
    font-weight:600;
    letter-spacing: .04em;
    color: var(--gold-bright);
    text-transform: uppercase;
  }

  .add-review .author-note{
    font-style: italic;
    color: var(--text-faint);
    font-size: 14px;
    margin-bottom: 18px;
  }

  textarea{
    width:100%;
    min-height: 92px;
    resize: vertical;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 16px;
    font-family: 'Cormorant Garamond', serif;
    outline:none;
    transition: border-color .2s;
  }
  textarea::placeholder{ color: var(--text-faint); font-style: italic; }
  textarea:focus{ border-color: var(--gold); }

  .add-review .row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 16px;
    gap: 14px;
    flex-wrap: wrap;
  }

  .rating-picker{
    display:flex;
    gap: 3px;
  }
  .star-btn{
    background:none;
    border:none;
    padding: 2px;
    font-size: 22px;
    line-height:1;
    cursor:pointer;
    color: var(--text-faint);
  }
  .star-btn.active{ color: var(--gold-bright); }
  .star-btn:hover{ transform: scale(1.12); }
  .star-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset:2px; border-radius:3px; }

  button#submitBtn{
    background: linear-gradient(100deg, var(--gold-bright), var(--gold));
    color: #1c1230;
    border:none;
    border-radius: 8px;
    padding: 10px 22px;
    font-family:'Cinzel', serif;
    font-size: 12px;
    font-weight:600;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor:pointer;
    transition: opacity .15s, transform .15s;
  }
  button#submitBtn:hover{ opacity:.9; transform: translateY(-1px); }
  button#submitBtn:focus-visible{ outline: 2px solid var(--gold-bright); outline-offset:2px; }

  .status-msg{
    font-style: italic;
    font-size: 13px;
    color: var(--text-faint);
    margin-top: 10px;
    min-height: 16px;
  }

  .feed-label{
    font-family:'Cinzel', serif;
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--gold);
    text-transform: uppercase;
    margin: 0 0 16px 2px;
    opacity:.85;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .review-card{
    padding: 18px 18px 16px;
    display:flex;
    flex-direction:column;
    gap: 11px;
    position:relative;
    transition: border-color .15s, background .15s;
  }
  .review-card::before{
    content:"✦";
    position:absolute;
    top:12px; right:14px;
    font-size: 11px;
    color: var(--gold);
    opacity:.35;
  }

  .review-card:hover{
    border-color: var(--card-border-hover);
    background: #201638;
  }

  .review-top{
    display:flex;
    align-items:center;
    gap: 11px;
  }

  /* mini tarot-card avatar, echoing the hero cards */
  .avatar{
    width: 26px;
    height: 36px;
    flex-shrink:0;
    border-radius: 4px;
    background: linear-gradient(160deg, #241a3d, #1b1230);
    border: 1px solid var(--card-border-hover);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar::before{
    content:"";
    position:absolute;
    inset: 3px;
    border: 1px solid rgba(212,175,106,0.3);
    border-radius: 2px;
  }
  .avatar span{
    font-size: 10px;
    color: var(--gold-bright);
    position:relative;
  }

  .name-block{ display:flex; flex-direction:column; gap:1px; }

  .name{ font-weight:600; font-size:16px; color: var(--text); }
  .spread-id{ font-family:'Cinzel', serif; font-size: 10px; color: var(--text-faint); letter-spacing:.05em; text-transform: uppercase; }

  .card-stars{ margin-left:auto; color: var(--gold-bright); font-size: 14px; letter-spacing:1px; }
  .card-stars .off{ color: rgba(255,255,255,0.15); }

  .review-text{
    color: var(--text-dim);
    font-size: 17px;
    line-height:1.55;
    margin:0;
  }

  footer{
    text-align:center;
    font-family:'Cinzel', serif;
    color: var(--text-faint);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 20px;
    position:relative;
    z-index:1;
  }
</style>
</head>
<body>

<div class="stars-bg"></div>

<header>

  <div class="card-fan" aria-hidden="true">
    <svg viewBox="0 0 220 150">
      <g class="card card1" transform="translate(75,66) rotate(-16)">
        <rect x="-32" y="-46" width="64" height="92" rx="7" fill="#1b1230" stroke="#c9a35f" stroke-width="1.2"/>
        <rect x="-26" y="-40" width="52" height="80" rx="4" fill="none" stroke="#e8c785" stroke-opacity="0.35" stroke-width="1"/>
        <text x="0" y="7" text-anchor="middle" font-size="16" style="fill:#e8c785">✦</text>
      </g>
      <g class="card card3" transform="translate(145,66) rotate(16)">
        <rect x="-32" y="-46" width="64" height="92" rx="7" fill="#1b1230" stroke="#c9a35f" stroke-width="1.2"/>
        <rect x="-26" y="-40" width="52" height="80" rx="4" fill="none" stroke="#e8c785" stroke-opacity="0.35" stroke-width="1"/>
        <text x="0" y="7" text-anchor="middle" font-size="16" style="fill:#e8c785">✦</text>
      </g>
      <g class="card card2" transform="translate(110,58)">
        <rect x="-34" y="-48" width="68" height="96" rx="7" fill="#241a3d" stroke="#e8c785" stroke-width="1.4"/>
        <rect x="-27" y="-41" width="54" height="82" rx="4" fill="none" stroke="#e8c785" stroke-opacity="0.5" stroke-width="1"/>
        <circle cx="0" cy="-6" r="10" fill="none" stroke="#e8c785" stroke-width="1"/>
        <text x="0" y="-1" text-anchor="middle" font-size="14" style="fill:#e8c785">✦</text>
        <line x1="-14" y1="18" x2="14" y2="18" stroke="#e8c785" stroke-opacity="0.4" stroke-width="1"/>
        <line x1="-10" y1="24" x2="10" y2="24" stroke="#e8c785" stroke-opacity="0.4" stroke-width="1"/>
      </g>
    </svg>
  </div>

  <div class="eyebrow"><span class="moon"></span> taro_otzovik</div>
  <h1>Отзывы о <span>раскладах</span></h1>
  <p>Поделитесь впечатлением от расклада — отзыв появится в общей ленте анонимно.</p>
  <div class="divider">✦</div>
</header>

<div class="container">

  <div class="add-review-wrap">
    <div class="add-review panel">
      <div class="panel-title">
        <h2>Оставить отзыв</h2>
      </div>
      <div class="author-note">Имя автора всегда будет показано как «Аноним»</div>

      <textarea id="reviewInput" placeholder="Расскажите о своём раскладе..."></textarea>

      <div class="row">
        <div class="rating-picker" id="ratingPicker" role="radiogroup" aria-label="Оценка">
          <button type="button" class="star-btn" data-v="1" aria-label="1 звезда">★</button>
          <button type="button" class="star-btn" data-v="2" aria-label="2 звезды">★</button>
          <button type="button" class="star-btn" data-v="3" aria-label="3 звезды">★</button>
          <button type="button" class="star-btn" data-v="4" aria-label="4 звезды">★</button>
          <button type="button" class="star-btn" data-v="5" aria-label="5 звёзд">★</button>
        </div>
        <button id="submitBtn">Отправить</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <p class="feed-label">Отзывы</p>
  <div class="grid" id="reviewsGrid"></div>
</div>

<footer>© 2026 · taro_otzovik</footer>

<script>
/* ==========================================================
   ЗАГЛУШКА ДЛЯ БЭКЕНДА — логика не изменена, только оформление
   ========================================================== */

const API_URL = "https://locisvpn.online/api/reviews";

async function loadReviewsFromServer() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error("Ошибка загрузки отзывов");
    return await res.json();
  } catch (err) {
    console.error(err);
    return null;
  }
}

async function saveReviewToServer(review) {
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(review)
    });
    if (!res.ok) throw new Error("Ошибка отправки отзыва");
    return await res.json();
  } catch (err) {
    console.error(err);
    return review;
  }
}

/* ========================================================== */

const texts = [
  "Все круто, спасибо!",
  "Отличный сервис, всё понравилось.",
  "Все супер, рекомендую.",
  "Очень доволен, все ок.",
  "Все отлично, буду обращаться еще.",
  "Хороший сервис, все круто.",
  "Все понравилось, спасибо большое.",
  "Все на высшем уровне.",
  "Все круто, никаких проблем.",
  "Отлично, все понравилось."
];

function randomFrom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function generateStubReviews(count){
  const result = [];
  for(let i = 0; i < count; i++){
    result.push({
      name: "Аноним",
      text: randomFrom(texts),
      rating: 4 + Math.round(Math.random())
    });
  }
  return result;
}

let reviews = [];

function spreadId(i){
  return "№ " + String(1000 + i * 7 + 3).slice(-4);
}

function renderReviews(){
  const grid = document.getElementById("reviewsGrid");
  grid.innerHTML = "";
  reviews.forEach((r, i) => {
    const card = document.createElement("div");
    card.className = "review-card panel";

    const isAnon = r.name === "Аноним";
    const initial = isAnon ? "✦" : r.name.charAt(0).toUpperCase();
    const starsHtml = "★".repeat(r.rating) + `<span class="off">${"★".repeat(5 - r.rating)}</span>`;

    card.innerHTML = `
      <div class="review-top">
        <div class="avatar"><span>${initial}</span></div>
        <div class="name-block">
          <span class="name">${r.name}</span>
          <span class="spread-id">${spreadId(i)}</span>
        </div>
        <div class="card-stars">${starsHtml}</div>
      </div>
      <p class="review-text">${r.text}</p>
    `;
    grid.appendChild(card);
  });
}

let currentRating = 5;
const ratingPicker = document.getElementById("ratingPicker");
function updateStars(){
  [...ratingPicker.children].forEach(s => {
    s.classList.toggle("active", Number(s.dataset.v) <= currentRating);
  });
}
ratingPicker.addEventListener("click", e => {
  const btn = e.target.closest(".star-btn");
  if(btn){
    currentRating = Number(btn.dataset.v);
    updateStars();
  }
});
updateStars();

document.getElementById("submitBtn").addEventListener("click", async () => {
  const input = document.getElementById("reviewInput");
  const statusMsg = document.getElementById("statusMsg");
  const text = input.value.trim();

  if(!text){
    statusMsg.textContent = "Напишите текст отзыва перед отправкой.";
    return;
  }

  const newReview = { name: "Аноним", text, rating: currentRating };

  statusMsg.textContent = "Отправка...";
  await saveReviewToServer(newReview);

  reviews.unshift(newReview);
  renderReviews();

  input.value = "";
  currentRating = 5;
  updateStars();
  statusMsg.textContent = "Спасибо! Отзыв опубликован.";
  setTimeout(() => statusMsg.textContent = "", 2500);
});

(async function init(){
  const fromServer = await loadReviewsFromServer();
  reviews = fromServer && fromServer.length ? fromServer : generateStubReviews(50);
  renderReviews();
})();
</script>

</body>
</html>
